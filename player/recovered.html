<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Stunt Pilot: San Francisco</title><style>
html,body{margin:0;width:100%;min-height:100%;background:#000}body{min-height:100vh;display:grid;place-items:center;overflow:hidden}#game{position:relative;width:960px;max-width:100vw;aspect-ratio:16/9;overflow:hidden;background:#000}#world,ruffle-player{position:absolute;inset:0;width:100%;height:100%;background:transparent}#world{pointer-events:none}html.viewport-fullscreen #game,#game:fullscreen{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;aspect-ratio:auto}#status:not([hidden]){position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:20px;color:#fff;background:#172433;font:16px system-ui;z-index:10}
</style><style>#preloader{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#155467 0%,#0c2b40 48%,#061827 100%);color:#e8ffff;font-family:Arial,sans-serif;transition:opacity .25s ease}
#preloader.is-ready{opacity:0;pointer-events:none}
.load-content{width:min(76%,560px);text-align:center;position:relative}
.load-emblem{width:64px;height:64px;margin:0 auto 14px;border:1px solid #59d5de66;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 9px #48cadb08}
.load-emblem svg{width:38px;height:38px;fill:#ffd16a;transform:rotate(-15deg)}
.load-eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;color:#85ced7;margin:0 0 9px}
.load-title{font-size:clamp(25px,4.4vw,46px);line-height:1.05;margin:0;color:#6ee5ed;font-weight:900;letter-spacing:-1px}
.load-title span{display:block;color:#ffc454;font-size:.73em;letter-spacing:2px;margin-top:6px}
.load-progress{margin:27px auto 0;max-width:360px;height:7px;background:#031825;border:1px solid #54dce33b;border-radius:8px;padding:3px;overflow:hidden}
.load-progress-fill{height:100%;width:4%;border-radius:5px;background:linear-gradient(90deg,#22c7d4,#91f8ed);transition:width .35s ease}
.load-phase{font-size:11px;letter-spacing:1px;color:#9ac3d0;margin:11px 0 0;min-height:14px}
.load-tip{border-top:1px solid #6ee5ed26;padding-top:15px;margin:23px auto 0;min-height:66px;max-width:440px;transition:opacity .2s ease,transform .2s ease}
.load-tip.is-changing{opacity:0;transform:translateY(7px)}
.load-tip-label{display:block;color:#ffc454;font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:7px}
.load-tip-text{font-size:13px;line-height:1.6;color:#c8e6ec;margin:0}
.load-orbit{position:absolute;right:-130px;top:-180px;width:450px;height:450px;border:1px solid #66e0e916;border-radius:50%;pointer-events:none;box-shadow:0 0 0 42px #66e0e905,0 0 0 100px #66e0e903}
@media(max-height:480px){.load-emblem{width:40px;height:40px;margin-bottom:9px}.load-emblem svg{width:26px;height:26px}.load-progress{margin-top:15px}.load-tip{margin-top:13px;padding-top:10px;min-height:46px}.load-title{font-size:29px}}
@media(prefers-reduced-motion:reduce){#preloader,.load-tip,.load-progress-fill{transition:none}}
@media(max-width:600px){.load-content{width:88%}.load-emblem{display:none}.load-eyebrow{font-size:8px;letter-spacing:2px;margin-bottom:5px}.load-title{font-size:23px}.load-title span{margin-top:3px}.load-progress{margin-top:12px;height:5px;padding:2px}.load-phase{font-size:9px;margin-top:6px}.load-tip{margin-top:12px;padding-top:8px;min-height:40px}.load-tip-label{font-size:8px;margin-bottom:4px}.load-tip-text{font-size:11px;line-height:1.35}}
</style></head><body><div id="game"><canvas id="world" width="960" height="540"></canvas></div><p id="status" role="status" hidden></p>
<script>window.RufflePlayer=window.RufflePlayer||{};window.RufflePlayer.config={autoplay:'on',unmuteOverlay:'visible',logLevel:'warn',wmode:'transparent',allowScriptAccess:true};</script>
<script src="/player/preloader.js"></script><script src="/player/viewport.js"></script><script src="/player/gpu/renderer.js"></script><script src="/player/ruffle-0.7.1/ruffle.js"></script>
<script>window.addEventListener('load',async()=>{try{await window.stuntGpuReady;window.stuntPreloader.phase("Loading flight controls…",0.84);const p=window.RufflePlayer.newest().createPlayer();document.querySelector('#game').append(p);await p.ruffle().load({url:'/build/stunt-pilot-gpu.swf',parameters:{gpu:'1'},wmode:'transparent',allowScriptAccess:true});}catch(e){const status=document.querySelector('#status');status.textContent='Unable to load the game: '+e.message;status.hidden=false;window.stuntPreloader?.fail("Unable to load. Please refresh to retry.");}});</script></body></html>
